<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JTools JS Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>JTools JS Example</h1>
    <label for="example-input">输入内容</label>
    <input id="example-input" value="Hello JTools">
    <button id="example-apply">应用</button>
    <p id="example-result" aria-live="polite">尚未应用</p>
    <button id="project">读取当前项目</button>
    <p id="status" aria-live="polite">点击后通过 JTools 读取真实项目路径</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
